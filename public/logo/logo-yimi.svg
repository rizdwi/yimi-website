<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Drop Shadow for Logo -->
    <filter id="yimiGlow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1F2F6B" flood-opacity="0.12"/>
    </filter>
    
    <!-- Curved Text Path -->
    <path id="textArcTop" d="M 68,200 A 132,132 0 1,1 332,200" fill="none"/>
    <path id="textArcBottom" d="M 332,200 A 132,132 0 0,1 68,200" fill="none"/>
  </defs>

  <g filter="url(#yimiGlow)">
    <!-- 8-Pointed Star Outer Ring (Square 1) -->
    <rect x="70" y="70" width="260" height="260" rx="20" fill="#3E5FD1" stroke="#1F2F6B" stroke-width="4"/>
    <!-- 8-Pointed Star Outer Ring (Square 2 rotated 45 deg) -->
    <rect x="70" y="70" width="260" height="260" rx="20" transform="rotate(45 200 200)" fill="#3E5FD1" stroke="#1F2F6B" stroke-width="4"/>

    <!-- Green Accent Line (Middle Star Outline) -->
    <rect x="80" y="80" width="240" height="240" rx="16" fill="none" stroke="#2EE05A" stroke-width="3" opacity="0.95"/>
    <rect x="80" y="80" width="240" height="240" rx="16" transform="rotate(45 200 200)" fill="none" stroke="#2EE05A" stroke-width="3" opacity="0.95"/>

    <!-- Inner Central Disc (Yellow background from logo) -->
    <circle cx="200" cy="200" r="126" fill="#FFF200" stroke="#1F2F6B" stroke-width="4"/>
    <circle cx="200" cy="200" r="118" fill="none" stroke="#2EE05A" stroke-width="2"/>

    <!-- Circular Red Banner Ring for Foundation Name -->
    <circle cx="200" cy="200" r="106" fill="#FFFFFF" stroke="#3E5FD1" stroke-width="2.5"/>

    <!-- Arched Text "YAYASAN INSAN MUSLIM ISTIQOMAH" -->
    <!-- Curved Text Along Arc -->
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12.5" fill="#D7261E" letter-spacing="2.4">
      <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
        YAYASAN INSAN MUSLIM ISTIQOMAH
      </textPath>
    </text>
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="10" fill="#1F2F6B" letter-spacing="3.5">
      <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
        • DAKWAH &amp; PENDIDIKAN SUNNAH •
      </textPath>
    </text>

    <!-- Center Badge: Mosque Dome + Crescent Moon + Quran + Dua Telapak Tangan -->
    <!-- Dome Base & Silhouette -->
    <g transform="translate(0, -6)">
      <!-- Crescent Moon (Hilal) atop the dome -->
      <path d="M 197 104 A 9 9 0 1 0 207 114 A 7.5 7.5 0 1 1 197 104 Z" fill="#3E5FD1"/>
      <polygon points="200,103 201,105 203,105 201.5,106.5 202,109 200,107.5 198,109 198.5,106.5 197,105 199,105" fill="#2EE05A"/>

      <!-- Mosque Dome (Kubah) -->
      <path d="M 200 114 C 182 130 174 148 174 162 L 226 162 C 226 148 218 130 200 114 Z" fill="#3E5FD1" stroke="#1F2F6B" stroke-width="2"/>
      <!-- Dome Ribs/Highlights -->
      <path d="M 200 114 C 193 130 190 148 190 162" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M 200 114 C 207 130 210 148 210 162" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <!-- Dome Base Trim -->
      <rect x="171" y="160" width="58" height="5" rx="2" fill="#2EE05A" stroke="#1F2F6B" stroke-width="1.5"/>

      <!-- Arch Windows in Dome Base -->
      <path d="M 183 160 A 3 3 0 0 1 189 160 Z" fill="#FFF200"/>
      <path d="M 197 160 A 3 3 0 0 1 203 160 Z" fill="#FFF200"/>
      <path d="M 211 160 A 3 3 0 0 1 217 160 Z" fill="#FFF200"/>
    </g>

    <!-- Open Holy Quran (Al-Qur'an Terbuka) -->
    <g transform="translate(0, 10)">
      <!-- Left Page -->
      <path d="M 200 196 C 185 191 165 190 152 195 C 150 196 149 198 149 200 L 149 224 C 163 219 184 220 200 226 Z" fill="#FFFFFF" stroke="#1F2F6B" stroke-width="2.5"/>
      <!-- Right Page -->
      <path d="M 200 196 C 215 191 235 190 248 195 C 250 196 251 198 251 200 L 251 224 C 237 219 216 220 200 226 Z" fill="#FFFFFF" stroke="#1F2F6B" stroke-width="2.5"/>
      <!-- Quran Page Text Lines (Scripture Accent) -->
      <line x1="158" y1="202" x2="192" y2="201" stroke="#3E5FD1" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="158" y1="208" x2="192" y2="207" stroke="#3E5FD1" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="158" y1="214" x2="190" y2="213" stroke="#3E5FD1" stroke-width="1.5" stroke-linecap="round"/>
      
      <line x1="208" y1="201" x2="242" y2="202" stroke="#3E5FD1" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="208" y1="207" x2="242" y2="208" stroke="#3E5FD1" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="210" y1="213" x2="242" y2="214" stroke="#3E5FD1" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Center Spine / Ribbon Bookmark -->
      <path d="M 200 194 L 200 231 L 203 228 L 206 231 L 206 195 Z" fill="#2EE05A" stroke="#1F2F6B" stroke-width="1"/>
    </g>

    <!-- Two Open Palms (Dua Telapak Tangan) cradling the Quran -->
    <g transform="translate(0, 12)">
      <!-- Left Hand -->
      <path d="M 148 232 C 148 226 156 225 164 227 C 172 229 184 233 194 235 C 196 238 194 242 191 243 C 180 245 167 246 156 243 C 151 241 148 237 148 232 Z" fill="#3E5FD1" stroke="#1F2F6B" stroke-width="2"/>
      <path d="M 152 232 C 160 234 172 238 184 239" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

      <!-- Right Hand -->
      <path d="M 252 232 C 252 226 244 225 236 227 C 228 229 216 233 206 235 C 204 238 206 242 209 243 C 220 245 233 246 244 243 C 249 241 252 237 252 232 Z" fill="#3E5FD1" stroke="#1F2F6B" stroke-width="2"/>
      <path d="M 248 232 C 240 234 228 238 216 239" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

      <!-- Joined Hand Base (Wrist/Cuff) -->
      <path d="M 180 241 C 193 245 207 245 220 241 C 216 249 184 249 180 241 Z" fill="#1F2F6B"/>
    </g>
  </g>
</svg>
